[package]
name = "dummy-secret-canister"
description = "PoC canister that receives one vetKD-sealed secret and decrypts it"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
candid = { workspace = true }
ic-cdk = { workspace = true }
ic-cdk-management-canister = { workspace = true }
ic-vetkeys = { workspace = true }
# ic-vetkeys pulls in `rand`, which will not build for wasm32 without a
# getrandom backend. This crate supplies a stub one; nothing here uses it.
ic-dummy-getrandom-for-wasm = "0.1.0"
