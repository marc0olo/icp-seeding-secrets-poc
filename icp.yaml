# yaml-language-server: $schema=https://github.com/dfinity/icp-cli/raw/refs/heads/main/docs/schemas/icp-yaml-schema.json

canisters:
  - name: sealed-secrets
    build:
      steps:
        - type: script
          commands:
            # --features test-hooks adds secret_sha256 and secret_reveal so you
            # can verify decryption locally. A real deployment builds WITHOUT it:
            # the default build has no endpoint that observes a secret at all.
            - cargo build -p sealed-secrets-canister --target wasm32-unknown-unknown --release --locked --features test-hooks
            - cp target/wasm32-unknown-unknown/release/sealed_secrets_canister.wasm "$ICP_WASM_OUTPUT_PATH"

    # Just the key name. The canister asks the subnet for its public key rather
    # than deriving it from a compiled-in constant, so the same build runs against
    # a local network and mainnet with nothing else to configure.
    init_args: '(record { key_name = "key_1" })'

networks:
  # Port 8000 is icp-cli's default; this project uses 8010 so it can run
  # alongside another project's local network.
  - name: local
    mode: managed
    gateway:
      bind: 127.0.0.1
      port: 8010

environments:
  - name: local
    network: local

  - name: ic
    network: ic
