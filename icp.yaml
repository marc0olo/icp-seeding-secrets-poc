# yaml-language-server: $schema=https://github.com/dfinity/icp-cli/raw/refs/heads/main/docs/schemas/icp-yaml-schema.json

canisters:
  # Two implementations of the same thing, so you can read whichever language
  # you think in. They share one interface and one seeding script.
  - name: dummy-secret-rust
    build:
      steps:
        - type: script
          commands:
            - command -v candid-extractor >/dev/null 2>&1 || { echo >&2 "candid-extractor not found. Run 'cargo install candid-extractor'."; exit 1; }
            - cargo build --package dummy-secret-canister --target wasm32-unknown-unknown --release --locked
            - TARGET_DIR=$(cargo metadata --format-version 1 --no-deps | sed -n 's/.*"target_directory":"\([^"]*\)".*/\1/p'); cp "${TARGET_DIR}/wasm32-unknown-unknown/release/dummy_secret_canister.wasm" "$ICP_WASM_OUTPUT_PATH"
            # Embedding candid:service is what makes `icp canister call` print
            # field names instead of hashes.
            - did="$(mktemp)"; candid-extractor "$ICP_WASM_OUTPUT_PATH" >"$did" && ic-wasm "$ICP_WASM_OUTPUT_PATH" -o "$ICP_WASM_OUTPUT_PATH" metadata "candid:service" -f "$did" -v public --keep-name-section
            - ic-wasm "$ICP_WASM_OUTPUT_PATH" -o "$ICP_WASM_OUTPUT_PATH" shrink --keep-name-section

  - name: dummy-secret-motoko
    build:
      steps:
        - type: script
          commands:
            - command -v mops >/dev/null 2>&1 || { echo >&2 "mops not found. See https://mops.one"; exit 1; }
            # Script steps run from the project root, so the cd is explicit.
            # $ICP_WASM_OUTPUT_PATH is absolute, so it survives it.
            - cd motoko/canister && mops install
            - cd motoko/canister && "$(mops toolchain bin moc)" $(mops sources) --enhanced-orthogonal-persistence -o "$ICP_WASM_OUTPUT_PATH" src/Main.mo
            # No metadata step, unlike the Rust canister: moc already embeds
            # candid:service, and `ic-wasm metadata` appends rather than
            # replaces, so a second section makes the replica reject the module.
            - ic-wasm "$ICP_WASM_OUTPUT_PATH" -o "$ICP_WASM_OUTPUT_PATH" shrink --keep-name-section

networks:
  # Port 8000 is icp-cli's default; this project uses 8010 so it can run
  # alongside another project's local network.
  - name: local
    mode: managed
    gateway:
      bind: 127.0.0.1
      port: 8010

environments:
  - name: local
    network: local

  - name: ic
    network: ic
