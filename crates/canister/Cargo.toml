[package]
name = "sealed-secrets-canister"
description = "PoC canister that receives vetKD-sealed secrets and decrypts them in enclave memory"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
# Adds endpoints that observe a decrypted secret: `secret_sha256` (a digest, for
# automated verification) and `secret_reveal` (the plaintext itself, so a human
# can see the round trip worked).
#
# OFF by default, so a plain `cargo build` produces a canister with no way to
# observe a secret at all — that property is checked by `scripts/local-test.sh`.
# Never enable this for a real deployment; see README "Can I just add a getter?".
test-hooks = []

[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
candid = { workspace = true }
ic-cdk = { workspace = true }
ic-cdk-management-canister = { workspace = true }
ic-dummy-getrandom-for-wasm = "0.1.0"
ic-stable-structures = { workspace = true }
ic-vetkeys = { workspace = true }
sealed-secrets-core = { path = "../core" }
serde = { workspace = true }
serde_bytes = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
zeroize = { workspace = true }
