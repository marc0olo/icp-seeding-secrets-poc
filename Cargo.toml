[workspace]
members = ["rust/canister", "rust/vectorgen"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85.0"
repository = "https://github.com/marc0olo/icp-seeding-secrets-poc"

[workspace.dependencies]
candid = "0.10.16"
ic-cdk = "0.20.1"
ic-cdk-management-canister = "0.1.1"
ic-vetkeys = "0.9.0"
ic_bls12_381 = "0.10.1"

[profile.release]
lto = true
opt-level = 'z'
panic = 'abort'
