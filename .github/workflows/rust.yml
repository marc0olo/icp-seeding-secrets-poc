# The Rust canister.
name: Rust

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A local network needs no cycles ledger top-up, but icp-cli still prompts
  # without this in a non-interactive shell.
  ICP_ENVIRONMENT: local

jobs:
  rust:
    name: build and lint
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/dfinity/icp-dev-env-all:v2.0.0
    steps:
      - uses: actions/checkout@v4

      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # rust-toolchain.toml pins a version the image does not ship, so rustup
      # fetches it on first use. Caching that plus the registry is the
      # difference between a ~4 minute job and a ~1 minute one.
      - name: Cache cargo and rustup
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.rustup/toolchains
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build canister
        run: cargo build -p dummy-secret-canister --target wasm32-unknown-unknown --release --locked

      # The .did is extracted from the wasm, so a drift between the code and the
      # committed interface shows up here.
      - name: Committed .did matches the canister
        run: |
          candid-extractor target/wasm32-unknown-unknown/release/dummy_secret_canister.wasm \
            > /tmp/extracted.did
          if ! diff -q /tmp/extracted.did rust/canister/dummy_secret.did >/dev/null; then
            echo "::error::rust/canister/dummy_secret.did is stale"
            diff rust/canister/dummy_secret.did /tmp/extracted.did | head -20
            exit 1
          fi
          echo "ok — the committed .did matches"
