# The real thing: a local replica, a deploy, and a secret sealed and spent.
#
name: End-to-end

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A local network needs no cycles ledger top-up, but icp-cli still prompts
  # without this in a non-interactive shell.
  ICP_ENVIRONMENT: local

jobs:
  e2e:
    name: seal and spend, against a local replica
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/dfinity/icp-dev-env-all:v2.0.0
    steps:
      - uses: actions/checkout@v4

      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # rust-toolchain.toml pins a version the image does not ship, so rustup
      # fetches it on first use. Caching that plus the registry is the
      # difference between a ~4 minute job and a ~1 minute one.
      - name: Cache cargo and rustup
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.rustup/toolchains
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install client dependencies
        working-directory: seed
        run: npm ci

      # Deploys both canisters, seals a secret into each with the seeding
      # script, reads it back, and checks it round-tripped.
      - name: Seal and read back, both canisters
        run: ./scripts/local-test.sh

      - name: Stop the network
        if: always()
        run: icp network stop || true

      - name: Upload replica logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: network-logs
          path: .icp/cache/networks/local/network-launcher/
          if-no-files-found: ignore
